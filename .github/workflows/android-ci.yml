name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Command-line tools are installed separately; the legacy tools package is obsolete.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Run unit tests and coverage
        run: |
          ./gradlew test :app:createDebugUnitTestCoverageReport --no-daemon
          test -s app/build/reports/coverage/test/debug/report.xml

      - name: Upload unit-test reports and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tether-go-test-reports
          # The shared ancestor is app/build; download into app/build below.
          path: |
            app/build/reports/coverage/test/debug/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Run Android lint
        run: ./gradlew lint --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tether-go-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  sonar:
    name: SonarQube scan
    needs: build
    timeout-minutes: 20
    # Fork and Dependabot PRs do not receive the repository's Sonar token.
    # Their tests and coverage still run; merged code is scanned on main.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Sonar token configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configure the SONAR_TOKEN Actions secret. See docs/SONAR.md."
            exit 1
          fi

      - name: Download unit-test reports and coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tether-go-test-reports
          path: app/build/

      - name: Verify analysis reports
        run: |
          test -s app/build/reports/coverage/test/debug/report.xml
          find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print -quit | grep -q .

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Cache SonarQube packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compile Android analysis bytecode
        # Recreate main/test classes and Android metadata without rerunning tests.
        run: ./gradlew :app:compileDebugUnitTestSources --no-daemon

      - name: Run SonarQube Cloud analysis and quality gate
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon -Dsonar.qualitygate.wait=true

  checks:
    # Preserve the required context and its build + Sonar quality-gate semantics.
    name: Gradle checks
    needs: [build, sonar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful build and applicable Sonar gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          EXPECT_SONAR: >-
            ${{ github.actor != 'dependabot[bot]' &&
                (github.event_name != 'pull_request' ||
                 github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Android build did not succeed ($BUILD_RESULT)."
            exit 1
          fi
          if [ "$EXPECT_SONAR" = true ]; then
            if [ "$SONAR_RESULT" != success ]; then
              echo "::error::SonarQube analysis and quality gate did not succeed ($SONAR_RESULT)."
              exit 1
            fi
          elif [ "$SONAR_RESULT" != skipped ]; then
            echo "::error::Expected only the intentional fork/Dependabot Sonar skip."
            exit 1
          fi
