# SonarCloud automatic analysis configuration for Tether Go.
#
# This mirrors Tether's repo-local SonarCloud configuration pattern. Keep this
# file small; add exclusions only for generated Android/Gradle artifacts or
# intentional data tables once app code exists.

# Gradle/Android build outputs and generated wrapper artifacts should never
# count as source if they are present in local checkouts or generated during CI.
sonar.exclusions=**/build/**,**/.gradle/**,**/.kotlin/**,gradle/wrapper/**
